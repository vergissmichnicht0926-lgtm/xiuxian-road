<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修仙之路 · 洞府</title>
<style>
:root {
  --bg: #08080f;
  --panel: #0f0f18;
  --border: #1c1c30;
  --gold: #c9a96e;
  --gold-bright: #e8d5a3;
  --gold-dim: #6b5840;
  --text: #c8c8b8;
  --text-dim: #7a7a68;
  --text-bright: #e8e8d8;
  --red: #c0392b;
  --red-soft: #d4645c;
  --green: #27ae60;
  --blue: #5b7fbf;
  --purple: #8b6eae;
  --pink: #c07080;
  --orange: #d48540;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% -10%, #141428 0%, transparent 55%),
    radial-gradient(ellipse at 85% 110%, #0c0c1c 0%, transparent 45%);
  color: var(--text);
  font-family: 'STKaiti','KaiTi','SimSun','Noto Serif SC',serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 16px;
  line-height: 1.75;
  letter-spacing: 0.03em;
}
.container { width:100%; max-width:620px; margin: 0 auto; display:flex; flex-direction:column; gap:12px; }

/* ── 头部 ── */
.header { text-align:center; padding:12px 0 4px; }
.header h1 { font-size:1.9em; color:var(--gold-bright); letter-spacing:0.18em; font-weight:normal;
  text-shadow:0 0 30px rgba(201,169,110,0.25); }
.header .subtitle { font-size:0.8em; color:var(--text-dim); letter-spacing:0.2em; margin-top:2px; }

/* ── 面板通用 ── */
.panel {
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  padding:14px 18px;
}
.panel-header {
  font-size:0.75em; color:var(--text-dim); letter-spacing:0.12em;
  margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;
}
.panel-header span:last-child { color:var(--gold-dim); }

/* ── 状态面板 ── */
.stats-grid { display:grid; grid-template-columns: repeat(4,1fr); gap:8px 12px; }
.stat-cell { display:flex; flex-direction:column; gap:1px; }
.stat-cell .lbl { font-size:0.7em; color:var(--text-dim); }
.stat-cell .val { font-size:1.05em; }
.stat-cell .val.realm { color:var(--gold-bright); text-shadow:0 0 10px rgba(201,169,110,0.2); }
.stat-cell .val.hp-low { color:var(--red-soft); }
.bar-wrap { grid-column:1/-1; height:5px; background:var(--border); border-radius:3px; overflow:hidden; margin-top:4px; }
.bar-fill { height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius:3px; transition:width 0.5s; }

/* ── 身世 ── */
.backstory { font-size:0.85em; color:var(--text-dim); font-style:italic; text-align:center;
  padding:8px 4px; border-top:1px solid var(--border); margin-top:10px; }
.backstory .bs-label { font-style:normal; font-size:0.7em; letter-spacing:0.15em; color:var(--gold-dim); margin-bottom:4px; }

/* ── 装备面板 ── */
.equip-grid { display:flex; gap:10px; }
.equip-slot { flex:1; background:#0c0c18; border:1px solid var(--border); border-radius:6px;
  padding:10px 12px; text-align:center; min-height:64px; display:flex; flex-direction:column;
  justify-content:center; gap:3px; transition:border-color 0.2s; }
.equip-slot:hover { border-color:var(--gold-dim); }
.equip-slot .slot-icon { font-size:1.2em; }
.equip-slot .slot-name { font-size:0.78em; color:var(--text-dim); }
.equip-slot .eq-name { font-size:0.85em; color:var(--text); }
.equip-slot .eq-quality { font-size:0.7em; }
.equip-slot .eq-level { font-size:0.65em; color:var(--text-dim); }
.q-凡品 { color:#9e9e9e; } .q-灵品 { color:var(--blue); } .q-宝品 { color:var(--purple); }
.q-仙品 { color:var(--orange); } .q-神品 { color:var(--gold-bright); }

/* ── 主按钮区 ── */
.actions-hall { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.hall-btn {
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
  padding:20px 16px; cursor:pointer; text-align:center; transition:all 0.25s;
  font-family:inherit; color:var(--text); position:relative; overflow:hidden;
}
.hall-btn:hover {
  border-color:var(--gold-dim); transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
  background:#141420;
}
.hall-btn:active { transform:scale(0.97); }
.hall-btn .hb-icon { font-size:2em; display:block; margin-bottom:6px; }
.hall-btn .hb-title { font-size:1em; letter-spacing:0.1em; color:var(--text-bright); }
.hall-btn .hb-sub { font-size:0.7em; color:var(--text-dim); margin-top:3px; }
.hall-btn .hb-cd { font-size:0.65em; color:var(--gold-dim); margin-top:2px; }
.hall-btn:disabled { opacity:0.35; cursor:not-allowed; pointer-events:none; }
.hall-btn.dual-btn { border-color:#5a3040; }
.hall-btn.dual-btn:hover { border-color:#a05070; background:#1a1018; }
.hall-btn.outing-btn { border-color:#3a3a20; }
.hall-btn.outing-btn:hover { border-color:#8a8040; background:#141208; }

/* ── 内容区(事件/结果) ── */
.content-area { background:var(--panel); border:1px solid var(--border); border-radius:8px;
  padding:20px; min-height:120px; }
.content-area .ca-badge { display:inline-block; font-size:0.65em; padding:2px 10px; border-radius:10px;
  letter-spacing:0.15em; margin-bottom:10px; border:1px solid; opacity:0.85; }
.badge-修炼 { color:var(--blue); border-color:#5b7fbf55; }
.badge-炼器 { color:var(--orange); border-color:#d4854055; }
.badge-游历 { color:var(--gold-bright); border-color:#c9a96e55; }
.badge-双修 { color:var(--pink); border-color:#c0708055; }
.ca-title { font-size:1.2em; color:var(--gold-bright); margin-bottom:8px; }
.ca-desc { font-size:0.9em; color:var(--text); white-space:pre-wrap; margin-bottom:14px; }
.ca-result { margin-top:12px; padding:12px 16px; background:#14141e; border-radius:6px;
  border-left:3px solid var(--gold-dim); font-size:0.85em; white-space:pre-wrap;
  animation: fadeUp 0.4s; }
.ca-input-row { display:flex; gap:8px; margin-top:12px; }
.ca-input-row input { flex:1; padding:10px 14px; background:#0a0a12; border:1px solid var(--border);
  border-radius:6px; color:var(--text); font-family:inherit; font-size:0.9em; }
.ca-input-row input:focus { outline:none; border-color:var(--gold-dim); }
.ca-input-row button { padding:10px 20px; background:#1a1008; border:1px solid var(--gold-dim);
  border-radius:6px; color:var(--gold-bright); cursor:pointer; font-family:inherit; font-size:0.9em; }
.ca-input-row button:hover { background:#2a1808; }

/* ── 选项按钮 ── */
.choices-row { display:flex; flex-direction:column; gap:7px; }
.ch-btn { width:100%; padding:11px 16px; background:var(--panel); border:1px solid var(--border);
  border-radius:6px; color:var(--text); font-family:inherit; font-size:0.9em; cursor:pointer;
  text-align:left; transition:all 0.2s; }
.ch-btn:hover { border-color:var(--gold-dim); background:#181828; transform:translateX(3px);
  box-shadow:0 0 12px rgba(201,169,110,0.08); }
.ch-btn:disabled { opacity:0.35; cursor:not-allowed; pointer-events:none; }
.ch-num { display:inline-block; width:22px; height:22px; line-height:22px; text-align:center;
  border-radius:50%; background:var(--border); font-size:0.7em; margin-right:8px; color:var(--text-dim); }

/* ── 修炼结算 ── */
.train-result { text-align:center; padding:10px; }
.train-result .tr-icon { font-size:2.5em; margin-bottom:6px; }
.train-result .tr-gains { font-size:0.85em; color:var(--green); margin:8px 0; }
.train-result .tr-loss { font-size:0.85em; color:var(--red-soft); margin:8px 0; }

/* ── 炼器界面 ── */
.forge-slot-select { display:flex; gap:8px; margin-bottom:12px; }
.forge-slot-select button { flex:1; padding:10px; background:var(--panel); border:1px solid var(--border);
  border-radius:6px; color:var(--text); cursor:pointer; font-family:inherit; font-size:0.85em; transition:all 0.2s; }
.forge-slot-select button:hover { border-color:var(--gold-dim); }
.forge-slot-select button.active { border-color:var(--gold-dim); background:#1a1810; color:var(--gold-bright); }
.forge-info { text-align:center; font-size:0.85em; color:var(--text-dim); margin:8px 0; }

/* ── 底部栏 ── */
.bar-row { display:flex; gap:8px; flex-wrap:wrap; }
.bar-btn { padding:7px 14px; background:transparent; border:1px solid var(--border); border-radius:5px;
  color:var(--text-dim); font-family:inherit; font-size:0.75em; cursor:pointer; transition:all 0.2s; letter-spacing:0.06em; }
.bar-btn:hover { border-color:var(--gold-dim); color:var(--text); }
.bar-btn.active { border-color:var(--gold-dim); color:var(--gold-bright); background:#14100a; }

/* ── 日志 ── */
.log-panel { background:var(--panel); border:1px solid var(--border); border-radius:8px;
  padding:10px 14px; max-height:100px; overflow-y:auto; font-size:0.73em; color:var(--text-dim); line-height:1.9; }
.log-entry.good { color:var(--green); } .log-entry.bad { color:var(--red-soft); } .log-entry.gold { color:var(--gold-dim); }

/* ── 游记面板 ── */
.journal-panel { display:none; background:var(--panel); border:1px solid var(--border); border-radius:8px;
  padding:14px 18px; max-height:260px; overflow-y:auto; }
.journal-panel.show { display:block; }
.journal-entry { padding:6px 0; border-bottom:1px solid #1a1a28; font-size:0.82em; }
.journal-entry:last-child { border-bottom:none; }
.journal-entry .j-age { color:var(--gold-dim); font-size:0.85em; margin-right:6px; }

/* ── 弹窗 ── */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:100;
  justify-content:center; align-items:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:22px; width:92%; max-width:440px; max-height:85vh; overflow-y:auto; }
.modal h3 { color:var(--gold-bright); margin-bottom:14px; font-weight:normal; letter-spacing:0.1em; font-size:1.05em; }
.modal label { display:block; font-size:0.75em; color:var(--text-dim); margin:10px 0 4px; letter-spacing:0.06em; }
.modal input,.modal textarea,.modal select { width:100%; padding:8px 12px; background:#0a0a12;
  border:1px solid var(--border); border-radius:5px; color:var(--text); font-family:inherit; font-size:0.88em; }
.modal textarea { min-height:60px; resize:vertical; }
.modal input:focus,.modal textarea:focus,.modal select:focus { outline:none; border-color:var(--gold-dim); }
.modal .btn-row { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; flex-wrap:wrap; }
.modal button { padding:8px 18px; border-radius:5px; font-family:inherit; font-size:0.85em; cursor:pointer;
  background:var(--panel); border:1px solid var(--border); color:var(--text); transition:all 0.2s; }
.modal button:hover { border-color:var(--gold-dim); }
.modal button.primary { background:#1a1008; border-color:#8a6030; color:var(--gold-bright); }
.modal button.primary:hover { background:#2a1808; }
.modal .toggle-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; }
.modal .toggle-row span { font-size:0.85em; }
.toggle-sw { width:44px; height:24px; border-radius:12px; background:var(--border); cursor:pointer;
  position:relative; transition:background 0.3s; }
.toggle-sw.on { background:var(--pink); }
.toggle-sw::after { content:''; position:absolute; width:18px; height:18px; border-radius:50%;
  background:#ddd; top:3px; left:3px; transition:left 0.3s; }
.toggle-sw.on::after { left:23px; }

.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:9px 22px;
  border-radius:20px; font-size:0.82em; background:#1a1a28; border:1px solid var(--border);
  color:var(--text); z-index:200; animation:fadeUp 0.3s; pointer-events:none; font-family:inherit; }
.toast.err { border-color:#5a2020; color:var(--red-soft); }

@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
.thinking { text-align:center; padding:30px; color:var(--gold-dim); animation:pulse 1.5s infinite; font-size:0.9em; }
.spinner { display:inline-block; width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--gold);
  border-radius:50%; animation:spin 0.8s linear infinite; margin-right:8px; vertical-align:middle; }
@keyframes spin { to{transform:rotate(360deg)} }
::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#282838; border-radius:2px; }

@media(max-width:480px) {
  .stats-grid { grid-template-columns:repeat(2,1fr); }
  .actions-hall { grid-template-columns:1fr; }
  .equip-grid { flex-direction:column; }
  .modal { padding:16px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>修 仙 之 路</h1><div class="subtitle">— 天地不仁，唯道永恒 —</div></div>

  <!-- 状态 + 身世 -->
  <div class="panel" id="statsPanel"></div>

  <!-- 装备 -->
  <div class="panel" id="equipPanel"></div>

  <!-- 内容区 -->
  <div class="content-area" id="contentArea"></div>
  <div class="choices-row" id="choicesRow"></div>

  <!-- 大厅按钮 -->
  <div class="actions-hall" id="hallActions"></div>

  <!-- 底部操作 -->
  <div class="bar-row">
    <button class="bar-btn" onclick="toggleJournal()">📖 游记</button>
    <button class="bar-btn" onclick="openSettings()">⚙️ 设置</button>
    <button class="bar-btn" onclick="resetGame()" style="color:var(--red-soft)">🔄 轮回</button>
  </div>

  <!-- 游记 -->
  <div class="journal-panel" id="journalPanel"></div>

  <!-- 日志 -->
  <div class="log-panel" id="logPanel"><div class="log-entry gold">🌟 踏入修仙之路…</div></div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>⚙️ 设置</h3>
    <label>AI 接口地址（OpenAI 兼容）</label>
    <input type="text" id="cfgURL" placeholder="https://api.openai.com/v1/chat/completions">
    <label>API Key</label>
    <input type="password" id="cfgKey" placeholder="sk-...">
    <label>模型名称</label>
    <input type="text" id="cfgModel" placeholder="gpt-4o-mini">
    <div class="toggle-row">
      <span>💕 双修模式</span>
      <div class="toggle-sw" id="toggleDual" onclick="toggleDualMode()"></div>
    </div>
    <label style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">📦 存档管理</label>
    <div class="btn-row" style="margin-top:6px;">
      <button onclick="exportSave()">📤 导出存档</button>
      <button onclick="importSave()">📥 导入存档</button>
    </div>
    <textarea id="saveDataIO" style="display:none;margin-top:8px;min-height:80px;font-size:0.75em;" readonly></textarea>
    <div class="btn-row" id="saveIORow" style="display:none;">
      <button onclick="document.getElementById('saveDataIO').style.display='none';document.getElementById('saveIORow').style.display='none';">取消</button>
      <button class="primary" id="saveIOAction"></button>
    </div>
    <div class="btn-row">
      <button onclick="closeSettings()">取消</button>
      <button class="primary" onclick="saveSettings()">💾 保存</button>
    </div>
  </div>
</div>

<script>
// ======================== 修仙之路 v2 ========================

// ── 境界体系 ──
const REALMS = [
  { name:'凡人',   xpNeed:0,     maxQ:'灵品', desc:'尚未踏入仙途' },
  { name:'练气期', xpNeed:50,    maxQ:'灵品', desc:'初感天地灵气' },
  { name:'筑基期', xpNeed:200,   maxQ:'宝品', desc:'筑就道基，脱胎换骨' },
  { name:'金丹期', xpNeed:600,   maxQ:'宝品', desc:'结成金丹，寿元大增' },
  { name:'元婴期', xpNeed:1500,  maxQ:'仙品', desc:'元婴出窍，神游太虚' },
  { name:'化神期', xpNeed:3500,  maxQ:'仙品', desc:'化神合道，一念山河动' },
  { name:'渡劫期', xpNeed:7000,  maxQ:'神品', desc:'天劫将至，九死一生' },
  { name:'大乘期', xpNeed:15000, maxQ:'神品', desc:'大道将成，只差一步' },
  { name:'飞升',   xpNeed:Infinity,maxQ:'神品', desc:'超脱三界，位列仙班' },
];
const QUALITIES = ['凡品','灵品','宝品','仙品','神品'];
const Q_COLORS = ['q-凡品','q-灵品','q-宝品','q-仙品','q-神品'];
const Q_NAME = { 凡品:'Common', 灵品:'Spirit', 宝品:'Treasure', 仙品:'Immortal', 神品:'Divine' };
const EQUIP_SLOTS = ['weapon','armor','artifact'];
const SLOT_INFO = { weapon:{ icon:'🔪', name:'武器', bonus:'修为加成' }, armor:{ icon:'🛡️', name:'防具', bonus:'生命上限' }, artifact:{ icon:'💎', name:'法宝', bonus:'灵力上限' } };

// ── 游戏状态 ──
let G = {
  name:'', gender:'', xp:10, spirit:30, maxSpirit:50, stone:20, hp:100, maxHp:100,
  age:20, realmIdx:0, trainCount:0, eventCount:0,
  backstory:'', travelLog:[], // {age,realm,summary}
  backstoryMilestones:[], // 已触发的身世主线境界
  equipment:{ weapon:null, armor:null, artifact:null }, // {name,quality,level}
  outingCooldown:0, dualCooldown:0,
  dualEnabled:false,
  statStoneSpent:0, statTotalOutings:0, statTotalDuals:0,
  danger:5, // 煞气值，越高越容易遇敌
};
let aiConfig = { url:'', key:'', model:'gpt-4o-mini' };
let currentView = 'hall'; // hall|training|equipment|outing|dual
let currentAdventure = null; // {title,desc,choices:[{text,effects,result,equipment}]}
let currentDual = null; // {partner:{...}, test:{...}}
let eventResolved = false;
let logs = [];

// ── 持久化 ──
function save() { try{ localStorage.setItem('xiuxian2',JSON.stringify(G)) }catch(e){} }
function load() { try{ const r=localStorage.getItem('xiuxian2'); if(r) G={...G,...JSON.parse(r)} }catch(e){} }
function saveCfg() { try{ localStorage.setItem('xiuxian2_cfg',JSON.stringify(aiConfig)) }catch(e){} }
function loadCfg() { try{ const r=localStorage.getItem('xiuxian2_cfg'); if(r) aiConfig={...aiConfig,...JSON.parse(r)} }catch(e){} }

// ── AI 调用 ──
async function aiCall(systemPrompt, userPrompt, timeout=30000, forceJson=true, retries=2) {
  if (!aiConfig.url || !aiConfig.key) throw new Error('请先配置AI接口');
  let lastError = null;
  for (let attempt = 0; attempt <= retries; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const body = {
        model: aiConfig.model,
        messages:[ {role:'system',content:systemPrompt}, {role:'user',content:userPrompt} ],
        temperature:0.85, max_tokens:4096,
      };
      if (forceJson) body.response_format = { type: 'json_object' };
      const res = await fetch(aiConfig.url, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${aiConfig.key}` },
        body: JSON.stringify(body),
        signal: ctrl.signal,
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`HTTP ${res.status}: ${errText.slice(0,200)}`);
      }
      const data = await res.json();
      let text = data.choices?.[0]?.message?.content || '';
      if (forceJson) text = extractJson(text);
      return { text, raw:data };
    } catch(e) {
      lastError = e;
      if (attempt < retries) {
        // 指数退避：1s → 2s
        await new Promise(r => setTimeout(r, (attempt+1)*1000));
        continue;
      }
    } finally { clearTimeout(timer); }
  }
  throw lastError;
}

function extractJson(text) {
  // 策略1: 去掉 markdown 代码块后再匹配
  let cleaned = text.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
  // 策略2: 匹配最外层 {...}（贪婪）
  const m = cleaned.match(/\{[\s\S]*\}/);
  if (m) return m[0];
  // 策略3: 原文本直接找
  const m2 = text.match(/\{[\s\S]*\}/);
  if (m2) return m2[0];
  return text;
}

function safeJsonParse(text, fallback=null) {
  // 多轮清理尝试
  const attempts = [
    text,
    text.replace(/```json\s*/gi,'').replace(/```\s*/g,''),
    text.replace(/```[\s\S]*?```/g, (block) => block.replace(/```json\s*/gi,'').replace(/```\s*/g,'')),
  ];
  for (const t of attempts) {
    try {
      const trimmed = t.trim();
      if (trimmed.startsWith('{')) return JSON.parse(trimmed);
    } catch(e) {}
  }
  // 最后尝试：从文本中暴力提取 JSON
  try {
    const extracted = extractJson(text);
    if (extracted && extracted.startsWith('{')) return JSON.parse(extracted);
  } catch(e) {}
  return fallback;
}

const MILESTONE_REALMS = [2, 4, 5]; // 金丹、元婴、化神
function realm() { return REALMS[Math.min(G.realmIdx, REALMS.length-1)]; }
function updateRealm() {
  let ni = G.realmIdx;
  for (let i=REALMS.length-1; i>G.realmIdx; i--) {
    if (G.xp >= REALMS[i].xpNeed) { ni=i; break; }
  }
  if (ni > G.realmIdx) {
    const old = REALMS[G.realmIdx].name;
    G.realmIdx = ni;
    G.maxHp = 100 + ni*50; G.hp = G.maxHp;
    G.maxSpirit = 50 + ni*30; G.spirit = Math.min(G.spirit, G.maxSpirit);
    addLog(`✨ 突破！${old} → ${realm().name}！`,'gold');
    // 身世主线触发
    if (MILESTONE_REALMS.includes(ni) && !G.backstoryMilestones.includes(realm().name) && G.backstory) {
      G._pendingMilestone = realm().name;
    }
    if (ni >= REALMS.length-1) { setTimeout(handleAscension,600); }
  }
  G.hp = Math.min(G.hp, G.maxHp);
  G.age = 20 + G.eventCount;
}

async function triggerBackstoryEvent() {
  const realmName = G._pendingMilestone;
  if (!realmName || !aiConfig.url || !aiConfig.key) return;
  G._pendingMilestone = null;
  G.backstoryMilestones.push(realmName);

  const content = document.getElementById('contentArea');
  const origHTML = content.innerHTML;
  content.innerHTML = `<div class="thinking"><span class="spinner"></span>命运之线颤动……身世之谜浮现……</div>`;

  try {
    const resp = await aiCall(
      `你是修仙世界的叙事者。玩家的身世背景如下，请根据此身世生成一段"身世主线"事件。

要求：
- 与玩家身世直接相关，推进身世谜团
- 60-120字，古风文笔，像是命运在揭示线索
- 给出一个小奖励（修为+20-60，或灵石+20-60）
- 严格输出JSON：{"title":"标题","narrative":"叙事内容","reward":{"type":"xp|stone","amount":数值}}

不要重复身世原文，而是推进它——揭示新的线索、遇到相关的人、或发现关键物品。`,
      `玩家：${G.name}（${G.gender==='女'?'女修':'男修'}），当前境界：${realmName}，年龄：${G.age}岁
身世：${G.backstory}
已触发的身世事件：${G.backstoryMilestones.join('、') || '无'}`,
      30000, true, 1
    );
    const data = safeJsonParse(resp.text);
    if (!data || !data.narrative) throw new Error('格式异常');

    // 发放奖励
    let rewardText = '';
    if (data.reward) {
      if (data.reward.type === 'xp') { G.xp += data.reward.amount||30; rewardText = `📖 修为 +${data.reward.amount||30}`; }
      else { G.stone += data.reward.amount||30; rewardText = `💎 灵石 +${data.reward.amount||30}`; }
    }
    updateRealm();

    content.innerHTML = `
      <span class="ca-badge badge-游历">身世之谜</span>
      <div class="ca-title">🔮 ${data.title||'命运低语'}</div>
      <div class="ca-desc" style="font-style:italic;">${data.narrative}</div>
      ${rewardText ? `<div class="ca-result"><div class="tr-gains">${rewardText}</div></div>` : ''}
    `;
    addLog(`🔮 身世之谜（${realmName}）：${(data.title||'').slice(0,20)}`,'gold');
  } catch(e) {
    content.innerHTML = origHTML;
    addLog(`🔮 身世感应微弱，线索暂时隐去……`,'');
  }
  save();
  renderAll();
}

function getStatRanges() {
  const r = G.realmIdx;
  return {
    xp: [Math.round(15*(r+1)), Math.round(60*(r+1))],
    spirit: [Math.round(5*(r+1)), Math.round(25*(r+1))],
    stone: [Math.round(10*(r+1)), Math.round(50*(r+1))],
    hp: [Math.round(-15*(r+0.5)), Math.round(25*(r+1))],
    maxQuality: realm().maxQ,
  };
}

// ── 装备辅助 ──
function equipBonus(slot) {
  const eq = G.equipment[slot];
  if (!eq) return 0;
  const qIdx = QUALITIES.indexOf(eq.quality);
  return (qIdx+1) * eq.level;
}
function equipSummary() {
  const parts = [];
  for (const s of EQUIP_SLOTS) {
    const eq = G.equipment[s];
    parts.push(eq ? `${SLOT_INFO[s].name}:${eq.name}(${eq.quality}+${eq.level})` : `${SLOT_INFO[s].name}:无`);
  }
  return parts.join('，');
}

// ======================== 修炼 ========================
async function doTraining() {
  currentView = 'training';
  eventResolved = false;
  G.trainCount++;

  // 基础收益
  const weaponBonus = equipBonus('weapon');
  const baseXp = 15 + G.realmIdx*8 + weaponBonus;
  const variance = Math.floor(Math.random() * baseXp*0.4);
  const xpGain = baseXp + variance;
  const spiritRecover = Math.floor((5 + G.realmIdx*3) * (0.7 + Math.random()*0.6));
  const ageInc = 1 + Math.floor(Math.random()*2);

  G.xp += xpGain;
  G.spirit = Math.min(G.maxSpirit, G.spirit + spiritRecover);
  G.eventCount += ageInc;
  updateRealm();

  // 冷却递减
  if (G.outingCooldown > 0) G.outingCooldown--;
  if (G.dualCooldown > 0) G.dualCooldown--;

  // 小概率触发修炼事件
  const eventChance = 0.12;
  let miniEvent = null;
  if (Math.random() < eventChance) {
    miniEvent = rollTrainingEvent();
  }

  const content = document.getElementById('contentArea');
  const choices = document.getElementById('choicesRow');

  content.innerHTML = `
    <span class="ca-badge badge-修炼">闭关修炼</span>
    <div class="ca-title">🧘 潜心修炼</div>
    <div class="ca-desc">你盘坐洞府，吐纳天地灵气。${ageInc}年光阴如水，修为在静默中悄然增长……</div>
    <div class="ca-result">
      <div class="train-result">
        <div class="tr-icon">${xpGain > baseXp*1.3 ? '✨ 顿悟之感！' : '🌿 心如止水'}</div>
        <div class="tr-gains">📖 修为 +${xpGain}　✨ 灵力 +${spiritRecover}</div>
        ${miniEvent ? `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);color:var(--gold-dim);">⚡ ${miniEvent.desc}</div>` : ''}
      </div>
    </div>
  `;

  if (miniEvent) {
    G.xp += miniEvent.xp || 0;
    G.spirit = Math.min(G.maxSpirit, G.spirit + (miniEvent.spirit||0));
    G.stone = Math.max(0, G.stone + (miniEvent.stone||0));
    G.hp = Math.min(G.maxHp, Math.max(0, G.hp + (miniEvent.hp||0)));
    addLog(miniEvent.log, miniEvent.logCls||'');
    updateRealm();
  }

  // 身世主线
  await triggerBackstoryEvent();

  // 煞气累积 + 战斗判定
  G.danger = Math.min(200, G.danger + 5 + Math.floor(Math.random() * 6));
  if (rollCombat()) {
    addLog(`🧘 修炼 ${ageInc} 年，修为+${xpGain}`,'good');
    await handleCombat();
    save();
    renderAll();
    return;
  }

  choices.innerHTML = `
    <button class="ch-btn" onclick="returnToHall()" style="text-align:center">
      <span class="ch-num">▶</span> 继续修行
    </button>
  `;

  addLog(`🧘 修炼 ${ageInc} 年，修为+${xpGain}`,'good');
  save();
  renderAll();
}

function resolveCombat(action, enemyPower, xpRange, stoneRange, enemyName) {
  const content = document.getElementById('contentArea');
  const choices = document.getElementById('choicesRow');
  const weaponBonus = equipBonus('weapon');
  const armorBonus = equipBonus('armor');
  let playerPower, resultHTML, logMsg, logCls;

  if (action === 'flee') {
    const cost = Math.round(stoneRange[0] / 2);
    if (G.stone < cost) {
      showToast('💎 灵石不足，只能力战！', 'err');
      resolveCombat('fight', enemyPower, xpRange, stoneRange, enemyName);
      return;
    }
    G.stone -= cost;
    G.statStoneSpent = (G.statStoneSpent||0) + cost;
    G.danger = Math.max(2, G.danger - 30);
    resultHTML = `
      <div class="ca-result">
        <div style="text-align:center;">
          <div style="font-size:2em;">💨</div>
          你扔下 ${cost} 灵石吸引注意，趁乱遁走……<br>
          <span style="color:var(--text-dim);font-size:0.85em;">💎 -${cost}</span>
        </div>
      </div>
    `;
    logMsg = `🏃 遁走避战（${enemyName}），灵石-${cost}`;
    logCls = '';
  } else {
    // 计算战力
    if (action === 'fight') {
      playerPower = G.realmIdx * 6 + weaponBonus * 3 + Math.floor(Math.random() * 20) + 5;
    } else { // spell
      G.spirit = Math.max(0, G.spirit - 12);
      playerPower = G.realmIdx * 10 + Math.floor(Math.random() * 30) + 8;
    }
    const ratio = playerPower / enemyPower;
    const spellCost = action === 'spell' ? '　✨ 灵力 -12' : '';

    if (ratio >= 1.3) {
      // 碾压
      const xpGain = Math.floor(Math.random() * (xpRange[1] - xpRange[0] + 1)) + xpRange[0] + 20;
      const stoneGain = Math.floor(Math.random() * (stoneRange[1] - stoneRange[0] + 1)) + stoneRange[0] + 10;
      G.xp += xpGain;
      G.stone += stoneGain;
      resultHTML = `
        <div class="ca-result">
          <div style="text-align:center;">
            <div style="font-size:2em;">💥</div>
            <b style="color:var(--gold-bright);">碾压胜利！</b><br>
            你以压倒性力量击溃了${enemyName}！<br>
            <span class="tr-gains">📖 修为 +${xpGain}　💎 灵石 +${stoneGain}${spellCost}</span>
          </div>
        </div>
      `;
      logMsg = `💥 碾压${enemyName}！修为+${xpGain}`;
      logCls = 'gold';

      // 概率掉落装备
      if (Math.random() < 0.25) {
        const slot = EQUIP_SLOTS[Math.floor(Math.random()*3)];
        const maxQ = Math.min(QUALITIES.indexOf(realm().maxQ), Math.floor(G.realmIdx/2)+1);
        const q = QUALITIES[Math.max(0, Math.min(maxQ, Math.floor(G.realmIdx/2 + Math.random()*2)))];
        const eq = { name: generateItemName(slot), quality: q, level: 1 + Math.floor(Math.random()*2) };
        const existing = G.equipment[slot];
        if (!existing || QUALITIES.indexOf(eq.quality) > QUALITIES.indexOf(existing.quality)) {
          G.equipment[slot] = eq;
          resultHTML += `<br><span style="color:var(--gold-dim);">🎁 战利品：${SLOT_INFO[slot].name} ${eq.name}（${eq.quality}+${eq.level}）</span>`;
          logMsg += `，获得${eq.name}`;
        }
      }
    } else if (ratio >= 0.85) {
      // 险胜
      const xpGain = Math.floor(Math.random() * (xpRange[1] - xpRange[0] + 1)) + xpRange[0];
      const stoneGain = Math.floor(Math.random() * (stoneRange[1] - stoneRange[0] + 1)) + stoneRange[0];
      const hpLoss = Math.floor((0.1 + Math.random()*0.15) * G.maxHp);
      G.xp += xpGain;
      G.stone += stoneGain;
      G.hp = Math.max(0, G.hp - hpLoss);
      resultHTML = `
        <div class="ca-result">
          <div style="text-align:center;">
            <div style="font-size:2em;">⚡</div>
            <b style="color:var(--orange);">苦战险胜！</b><br>
            一番激战后你击败了${enemyName}，但也受了伤……<br>
            <span class="tr-gains">📖 修为 +${xpGain}　💎 灵石 +${stoneGain}${spellCost}</span><br>
            <span class="tr-loss">❤️ 生命 -${hpLoss}</span>
          </div>
        </div>
      `;
      logMsg = `⚡ 险胜${enemyName}，修为+${xpGain}，生命-${hpLoss}`;
      logCls = 'good';
    } else if (ratio >= 0.6) {
      // 落败但逃脱
      const hpLoss = Math.floor((0.2 + Math.random()*0.2) * G.maxHp);
      const stoneLoss = Math.floor(stoneRange[0] * (0.3 + Math.random()*0.4));

        <div class="ca-result">
          <div style="text-align:center;">
            <div style="font-size:2em;">💔</div>
            <b style="color:var(--red-soft);">不敌败退……</b><br>
            ${enemyName}实力强大，你拼尽全力才得以脱身。<br>
            <span class="tr-loss">❤️ 生命 -${hpLoss}　💎 灵石 -${stoneLoss}${spellCost}</span>
          </div>
        </div>
      `;
      logMsg = `💔 不敌${enemyName}，生命-${hpLoss}`;
      logCls = 'bad';
    } else {
      // 惨败
      const hpLoss = Math.floor((0.35 + Math.random()*0.3) * G.maxHp);
      const stoneLoss = Math.floor(stoneRange[0] * (0.5 + Math.random()*0.5));
      G.hp = Math.max(0, G.hp - hpLoss);
      G.stone = Math.max(0, G.stone - stoneLoss);
      G.statStoneSpent = (G.statStoneSpent||0) + stoneLoss;
      resultHTML = `
        <div class="ca-result">
          <div style="text-align:center;">

async function doForge() {
  const eq = G.equipment[forgeSlot];
  const curQIdx = eq ? QUALITIES.indexOf(eq.quality) : -1;
  const realmMaxQIdx = QUALITIES.indexOf(realm().maxQ);
  const forgeCost = eq ? (curQIdx+1)*(eq.level+1)*15 : 20;
  const successRate = eq ? Math.max(0.25, 0.9 - curQIdx*0.12 - eq.level*0.04) : 0.85;

  if (G.stone < forgeCost) { showToast('灵石不足！','err'); return; }
  G.stone -= forgeCost;
  G.eventCount += 1;

  const roll = Math.random();
  const content = document.getElementById('contentArea');
  const choices = document.getElementById('choicesRow');

  if (!eq) {
    // 首次锻造
    G.equipment[forgeSlot] = { name:generateItemName(forgeSlot), quality:'凡品', level:1 };
    content.innerHTML += `
      <div class="ca-result">
        <div class="train-result">
          <div class="tr-icon">🔨</div>
          <div>成功锻造！</div>
          <div class="tr-gains">获得 ${SLOT_INFO[forgeSlot].name}：<span class="q-凡品">${G.equipment[forgeSlot].name}（凡品+1）</span></div>
        </div>
      </div>
    `;
    addLog(`🔨 锻造成功：${G.equipment[forgeSlot].name}`,'good');
  } else if (roll < successRate * 0.15 && curQIdx < realmMaxQIdx) {
    // 大成功：品质+1
    G.equipment[forgeSlot].quality = QUALITIES[curQIdx+1];
    G.equipment[forgeSlot].level = 1;
    G.equipment[forgeSlot].name = generateItemName(forgeSlot);
    content.innerHTML += `
      <div class="ca-result">
        <div class="train-result">
          <div class="tr-icon">🌟 大成功！</div>
          <div>品质突破至 <span class="${Q_COLORS[curQIdx+1]}">${QUALITIES[curQIdx+1]}</span>！</div>
        </div>
      </div>
    `;
    addLog(`🌟 大成功！${SLOT_INFO[forgeSlot].name}突破至${QUALITIES[curQIdx+1]}`,'gold');
  } else if (roll < successRate) {
    // 成功：等级+1
    G.equipment[forgeSlot].level++;
    content.innerHTML += `
      <div class="ca-result">
        <div class="train-result">
          <div class="tr-icon">✅</div>
          <div>升级成功！ ${G.equipment[forgeSlot].quality}+${G.equipment[forgeSlot].level}</div>
        </div>
      </div>
    `;
    addLog(`✅ ${G.equipment[forgeSlot].name} → +${G.equipment[forgeSlot].level}`,'good');
  } else if (roll < successRate + 0.2) {
    // 失败但未损坏
    content.innerHTML += `
      <div class="ca-result">
        <div class="train-result">
          <div class="tr-icon">💨</div>
          <div class="tr-loss">锻造失败，材料化为飞灰……但装备未受损。</div>
        </div>
      </div>
    `;
    addLog('💨 锻造失败，灵石白费','bad');
  } else {
    // 降级
    if (G.equipment[forgeSlot].level > 1) {
      G.equipment[forgeSlot].level--;
      content.innerHTML += `
        <div class="ca-result">
          <div class="train-result"><div class="tr-icon">💔</div>
          <div class="tr-loss">锻造失败！装备受损，等级-1。</div></div>
        </div>
      `;
      addLog(`💔 ${G.equipment[forgeSlot].name} 降级至+${G.equipment[forgeSlot].level}`,'bad');
    } else {
      G.equipment[forgeSlot] = null;
      content.innerHTML += `
        <div class="ca-result">
          <div class="train-result"><div class="tr-icon">💥</div>
          <div class="tr-loss">装备彻底碎裂！</div></div>
        </div>
      `;
      addLog('💥 装备碎裂！','bad');
    }
  }

  updateRealm();
  await triggerBackstoryEvent();
  choices.innerHTML = `
    <button class="ch-btn" onclick="renderEquipView()" style="text-align:center">
      <span class="ch-num">⚒</span> 继续锻造
    </button>
    <button class="ch-btn" onclick="returnToHall()" style="text-align:center">
      <span class="ch-num">↩</span> 返回洞府
    </button>
  `;
  save();
  renderAll();
}

const WEAPON_NAMES = ['青锋','寒霜','赤霄','墨渊','紫电','龙吟','凤鸣','星河','断岳','流光'];
const ARMOR_NAMES = ['玄铁甲','灵纹袍','金缕衣','冰蚕丝','玄武铠','天罗衫','云锦氅','星辉袍'];
const ARTIFACT_NAMES = ['聚灵珠','镇魂铃','八卦镜','避水珠','定风幡','乾坤袋','山河印','玲珑塔'];
function generateItemName(slot) {
  const pool = slot==='weapon'?WEAPON_NAMES : slot==='armor'?ARMOR_NAMES : ARTIFACT_NAMES;
  return pool[Math.floor(Math.random()*pool.length)] + (Math.random()>0.5?'':['·改','·真','·极'][Math.floor(Math.random()*3)]);
}

function clampArr(vals, range) {
  if (!Array.isArray(vals) || vals.length<2) return [range[0], range[1]];
  return [
    Math.max(range[0], Math.min(range[1], Math.round(vals[0]))),
    Math.max(range[0], Math.min(range[1], Math.round(vals[1]))),
  ].sort((a,b)=>a-b);
}

function validateEquipment(eq) {
  if (!eq || !eq.slot || !EQUIP_SLOTS.includes(eq.slot)) return null;
  const maxQ = realm().maxQ;
  const maxQIdx = QUALITIES.indexOf(maxQ);
  const qIdx = QUALITIES.indexOf(eq.quality);
  if (qIdx < 0 || qIdx > maxQIdx) eq.quality = maxQ;
  eq.level = Math.max(1, Math.min(3, eq.level||1));
  eq.name = (eq.name||'神秘之物').slice(0,10);
  return eq;
}

async function resolveOuting(idx) {
  if (!currentAdventure || eventResolved) return;
  const c = currentAdventure.choices[idx];
  if (!c) return;

  // 检查灵石是否足够
  if (c.cost && c.cost.stone > G.stone) {
    showToast('💎 灵石不足！','err');
    return;
  }

  eventResolved = true;
  // 扣除灵石
  if (c.cost) {
    G.stone = Math.max(0, G.stone - c.cost.stone);
    G.statStoneSpent = (G.statStoneSpent||0) + c.cost.stone;
  }

  let resultExtra = '';
  // 应用效果
  for (const [stat, [lo,hi]] of Object.entries(c.effects)) {
    const val = Math.floor(Math.random()*(hi-lo+1))+lo;
    applyEffect(stat, val);
    resultExtra += statIcon(stat)+' '+(val>=0?'+':'')+val+'  ';
  }

  // 灵石消耗
  if (c.cost) {
    resultExtra += `\n💎 消耗灵石 -${c.cost.stone}`;
  }

  // 装备奖励
  if (c.equipment) {
    const eq = c.equipment;
    const existing = G.equipment[eq.slot];
    if (!existing || QUALITIES.indexOf(eq.quality) > QUALITIES.indexOf(existing.quality) ||
        (eq.quality === existing.quality && eq.level > existing.level)) {
      G.equipment[eq.slot] = { name:eq.name, quality:eq.quality, level:eq.level };
      resultExtra += `\n🎁 获得装备：${eq.name}（${eq.quality}+${eq.level}）`;
      addLog(`🎁 获得${SLOT_INFO[eq.slot].name}：${eq.name}`,'gold');
    }
  }

  updateRealm();
  await triggerBackstoryEvent();

  // 游记记录
  const journal = currentAdventure.journal ||
    `${G.age}岁·${realm().name} —— ${currentAdventure.title}`;
  G.travelLog.push({ age:G.age, realm:realm().name, summary: journal });
  if (G.travelLog.length > 40) G.travelLog.shift();

  const content = document.getElementById('contentArea');
  content.querySelector('.ca-desc').insertAdjacentHTML('afterend', `
    <div class="ca-result">
      ${c.result}<br>
      <span style="font-size:0.8em;color:var(--text-dim);margin-top:6px;display:inline-block">${resultExtra}</span>
    </div>
  `);
  document.getElementById('choicesRow').innerHTML = `
    <button class="ch-btn" onclick="returnToHall()" style="text-align:center">
      <span class="ch-num">▶</span> 继续修行
    </button>
  `;

  save();
  renderAll();
}

function statIcon(s) { return {xp:'📖',spirit:'✨',stone:'💎',hp:'❤️'}[s]||s; }
function applyEffect(stat, val) {
  switch(stat) {
    case 'xp': G.xp = Math.max(0, G.xp+val); break;
    case 'spirit': G.spirit = Math.max(0, Math.min(G.maxSpirit, G.spirit+val)); break;
    case 'stone': G.stone = Math.max(0, G.stone+val); break;
    case 'hp': G.hp = Math.min(G.maxHp, Math.max(0, G.hp+val)); break;
  }
}

async function submitDualAnswer() {
  const input = document.getElementById('dualAnswer');
  const answer = input?.value.trim();
  if (!answer || !currentDual) { shakeElement(input); return; }

  const content = document.getElementById('contentArea');
  const choices = document.getElementById('choicesRow');
  content.querySelector('.ca-input-row')?.remove();
  choices.innerHTML = '<div class="thinking"><span class="spinner"></span>道侣正在思量你的回答……</div>';

  G.spirit = Math.max(0, G.spirit - 15);

  try {
    // Step 2: 判定
    const judgeResp = await aiCall(
      `你是修仙世界的叙事者。请判断玩家的回答是否通过了道侣的考验。输出JSON：{"passed":true/false,"feedback":"评价（25字以内，古风）"}

标准：只要回答有诚意、有灵气或文采，即应通过。不要过于严格。`,
      `道侣：${currentDual.partner.title}·${currentDual.partner.name}（${currentDual.partner.personality}）
考验（${currentDual.test.type}）：${currentDual.test.question}
期望方向：${currentDual.test.expectedTheme}
玩家回答：${answer}`
    );
    const judge = safeJsonParse(judgeResp.text, {passed:true,feedback:'……尚可。'});

    if (!judge.passed) {
      // 失败
      content.innerHTML = `
        <span class="ca-badge badge-双修">双修</span>
        <div class="ca-title">💫 缘悭一面</div>
        <div class="ca-desc">${currentDual.partner.title}微微一笑，眼中闪过一丝失望。</div>
        <div class="ca-result">
          <em>"${judge.feedback}"</em><br><br>
          <span style="font-size:0.85em;color:var(--text-dim);">她转身离去，消失在云雾之中……下次再试吧。</span>
        </div>
      `;
      addLog(`💫 ${currentDual.partner.name}：${judge.feedback}`,'bad');
      G.dualCooldown = 3 + Math.floor(Math.random()*3);
    } else {
      // 通过 → 涩涩场景
      content.innerHTML = '<div class="thinking"><span class="spinner"></span>道心相合，灵肉交融……</div>';
      choices.innerHTML = '';

      const sceneResp = await aiCall(
        `你是温柔合意的R18叙事者。请描写双修场景。

核心要求：
- 双方合意、互相渴望。注重亲密感、信任感与情感连接
- 过程完整：拥抱→亲吻→爱抚→交合→高潮→余韵
- 直接但中性的器官称谓（乳房、阴蒂、龟头、阴道、阴茎）
- 丰富的感官细节：体温、呼吸、心跳、皮肤触感、湿润度、肌肉紧绷与释放
- 自然的对话：情话、呻吟、低语、呼唤名字、喘息——不含羞辱性称呼
- 情绪重心：依恋、渴望、被填满的满足感、互相取悦的快乐、事后温存
- 甜涩交织，底色是甜的
- 严禁：暴力、强制、羞辱、脏话辱骂、疼痛凌辱
- 180-350字，古风但可直白`,
        `${G.name}（${G.gender==='女'?'女修':'男修'}，${realm().name}，${G.age}岁）与 ${currentDual.partner.title}·${currentDual.partner.name}（${currentDual.partner.appearance}，${currentDual.partner.personality}，${currentDual.partner.realm}）在洞府中四目相对，道心动摇。`,
        30000, false
      );
      const scene = (sceneResp.text||'').trim();

      // 高额收益
      const xpGain = 40 + G.realmIdx*30 + Math.floor(Math.random()*60);
      const spiritGain = 15 + G.realmIdx*8;
      G.xp += xpGain;
      G.spirit = Math.min(G.maxSpirit, G.spirit + spiritGain);
      updateRealm();
      await triggerBackstoryEvent();

      content.innerHTML = `
        <span class="ca-badge badge-双修">双修 · 灵肉交融</span>
        <div class="ca-title">💕 ${currentDual.partner.name} · 春风一度</div>
        <div class="ca-desc" style="line-height:1.9;white-space:pre-wrap;">${scene}</div>
        <div class="ca-result">
          <div class="tr-gains">📖 修为 +${xpGain}　✨ 灵力 +${spiritGain}</div>
          <div style="margin-top:8px;font-size:0.8em;color:var(--text-dim);">——云雨初歇，道心与情丝交织，修为大进。</div>
        </div>
      `;
      addLog(`💕 与${currentDual.partner.name}双修，修为+${xpGain}`,'gold');
      G.statTotalDuals = (G.statTotalDuals||0) + 1;
      G.dualCooldown = 6 + Math.floor(Math.random()*5); // 6-10次
    }
  } catch(e) {
    content.innerHTML = `
      <span class="ca-badge badge-双修">双修</span>
      <div class="ca-title">💫 灵力紊乱</div>
      <div class="ca-result" style="color:var(--red-soft)">${e.message}</div>
    `;

  G.eventCount += 2;
  choices.innerHTML = `<button class="ch-btn" onclick="returnToHall()" style="text-align:center"><span class="ch-num">▶</span>继续修行</button>`;
  save();
  renderAll();
}

// ── 存档导入导出 ──
function exportSave() {
  const data = { game: G, config: aiConfig, version: 2 };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const ta = document.getElementById('saveDataIO');
  ta.style.display = 'block';
  ta.value = b64;
  ta.select();
  document.getElementById('saveIORow').style.display = 'flex';
  document.getElementById('saveIOAction').textContent = '📋 复制到剪贴板';
  document.getElementById('saveIOAction').onclick = () => {
    navigator.clipboard.writeText(b64).then(() => showToast('✅ 存档已复制！'));
  };
  showToast('📤 存档已生成，点击按钮复制');
}

function importSave() {
  const b64 = prompt('请粘贴存档数据（base64）：');
  if (!b64) return;
  try {
    const json = decodeURIComponent(escape(atob(b64.trim())));
    const data = JSON.parse(json);
    if (!data.game || !data.game.name) throw new Error('存档数据不完整');
    G = { ...G, ...data.game };
    if (data.config) aiConfig = { ...aiConfig, ...data.config };
    save(); saveCfg();
    showToast('✅ 存档导入成功！');
    returnToHall();
  } catch(e) {
    showToast('❌ 存档格式错误：' + e.message, 'err');
  }
}

}

function showNameInput() {
  document.getElementById('contentArea').innerHTML = `
    <div style="text-align:center;padding:20px 0;">
      <div style="font-size:3em;margin-bottom:12px;">🌄</div>
      <div class="ca-title">踏入仙途</div>
      <div class="ca-desc">山巅之上，云雾缭绕。<br>一道苍老的声音自天际传来：<br><br><em>"来者何人？报上你的道号——"</em></div>
      <div class="ca-input-row">
        <input id="nameInput" type="text" placeholder="道号（2-8字）" maxlength="10" autocomplete="off">
        <button onclick="confirmName()">继 续</button>
      </div>
    </div>
  `;
  document.getElementById('choicesRow').innerHTML = '';
  document.getElementById('hallActions').innerHTML = '';
  setTimeout(()=>document.getElementById('nameInput')?.focus(),100);
}

function confirmName() {
  const input = document.getElementById('nameInput');
  const name = input?.value.trim();
  if (!name || name.length<1) { shakeElement(input); return; }
  G.name = name;
  showGenderSelect();
}

function showGenderSelect() {
  document.getElementById('contentArea').innerHTML = `
    <div style="text-align:center;padding:20px 0;">
      <div style="font-size:3em;margin-bottom:12px;">☯️</div>
      <div class="ca-title">阴阳分晓</div>
      <div class="ca-desc">那道声音又问道：<br><br><em>"且慢——你是男儿身，还是女儿身？"</em></div>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:18px;">
        <button onclick="confirmGender('男')" style="padding:14px 36px;background:#0a1220;border:2px solid #3a6090;border-radius:8px;color:#7ab8e8;font-family:inherit;font-size:1.1em;cursor:pointer;transition:all 0.25s;letter-spacing:0.1em;">
          ⚔️ 男儿身
        </button>
        <button onclick="confirmGender('女')" style="padding:14px 36px;background:#120a14;border:2px solid #704060;border-radius:8px;color:#c07090;font-family:inherit;font-size:1.1em;cursor:pointer;transition:all 0.25s;letter-spacing:0.1em;">
          🌸 女儿身
        </button>
      </div>
    </div>
  `;
  document.getElementById('choicesRow').innerHTML = '';
  document.getElementById('hallActions').innerHTML = '';
}

function confirmGender(gender) {
  G.gender = gender;
  const genderLabel = gender === '男' ? '♂ 乾道' : '♀ 坤道';
  addLog(`🌟 "${G.name}"（${genderLabel}）踏入修仙之路！`,'gold');
  save();
  returnToHall();
}

// ── 工具 ──
function showToast(msg, cls='') {
  const t = document.createElement('div');
  t.className = 'toast '+(cls||'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
function shakeElement(el) { if(!el)return; el.style.animation='none'; el.offsetHeight; el.style.animation='shake 0.4s'; }

// ── 事件绑定 ──
document.getElementById('settingsModal').addEventListener('click', function(e){ if(e.target===this)closeSettings(); });
document.addEventListener('keydown', function(e){
  if (e.key==='Enter' && document.getElementById('nameInput')===document.activeElement) confirmName();
  if (e.key==='Enter' && document.getElementById('dualAnswer')===document.activeElement) submitDualAnswer();
  if (e.key==='Escape') closeSettings();
});

// ── 启动 ──
loadCfg();
load();
if (!G.name) { showNameInput(); renderStats(); renderEquip(); renderHallButtons(); }
else if (!G.gender) { showGenderSelect(); renderStats(); renderEquip(); renderHallButtons(); }
else { returnToHall(); }
</script>
</body>
</html>
